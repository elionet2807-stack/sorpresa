<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #fcf6ea; /* Color crema */
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- PANTALLA DE INICIO --- */
        #intro {
            position: absolute;
            z-index: 100;
            width: 100%;
            height: 100%;
            background: #fcf6ea;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out;
            text-align: center; /* Asegura que el texto se centre */
        }

        .start-btn {
            font-size: 6rem;
            color: #d32f2f;
            cursor: pointer;
            animation: latido 1s infinite;
            filter: drop-shadow(0 0 15px rgba(211, 47, 47, 0.5));
            margin-bottom: 20px;
        }

        /* Texto personalizado "Con cariño de Elio..." */
        .intro-text {
            font-family: 'Dancing Script', cursive;
            color: #c62828;
            font-size: 2rem; /* Tamaño grande y legible */
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .click-hint {
            color: #888; 
            margin-top: 10px; 
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* --- CONTENEDOR CENTRAL --- */
        #content-layer {
            position: absolute;
            z-index: 10;
            text-align: center;
            opacity: 0;
            transition: opacity 3s ease-in;
            top: 45%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 450px;
            pointer-events: none;
        }

        /* --- FOTO MÁS GRANDE --- */
        .photo-frame {
            width: 230px;  
            height: 230px; 
            border-radius: 50%;
            border: 8px solid #fff;
            box-shadow: 0 0 25px rgba(211, 47, 47, 0.25);
            overflow: hidden;
            margin: 0 auto 25px auto;
            background: white;
            position: relative;
            top: -20px; 
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- TARJETA --- */
        .message-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #c62828;
            font-size: 2.5rem;
            margin: 0;
        }

        p {
            color: #5d4037;
            font-size: 1rem;
            line-height: 1.6;
            margin: 10px 0;
        }

        /* --- CONTADOR --- */
        .timer-badge {
            background: linear-gradient(45deg, #d32f2f, #ff4081);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.4);
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div id="intro" onclick="startAnimation()">
        <div class="start-btn">❤️</div>
        <div class="intro-text">Con todo mi cariño, de Elio...</div>
        <p class="click-hint">( Toca el corazón para ver )</p>
    </div>

    <div id="content-layer">
        <div class="photo-frame">
            <img src="nosotros.jpg" onerror="this.src='https://img.freepik.com/premium-vector/couple-love-hugging-scenery-flat-design_609724-18.jpg'" alt="Nosotros">
        </div>

        <div class="message-card">
            <h1>Para el amor de mi vida</h1>
            <p>Si pudiera elegir un lugar seguro,<br>sería en tus brazos.<br>Gracias por hacerme feliz Dioce, ¡Te amo mucho!<br>Tiempo de casados y contando....</p>
            <div id="timer" class="timer-badge">Calculando tiempo juntos...</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // --- FECHA EXACTA: 22 de Octubre de 2016 ---
        const startDate = new Date(2016, 9, 22, 12, 0, 0); 

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        const colors = ["#ffcdd2", "#ef9a9a", "#e57373", "#ef5350", "#f44336", "#c62828", "#ad1457", "#ff80ab"];
        let particles = [];
        let floatingHearts = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function startAnimation() {
            const intro = document.getElementById('intro');
            intro.style.opacity = 0;
            setTimeout(() => intro.style.display = 'none', 1000);

            document.getElementById('bgMusic').play().catch(e => console.log("Audio requiere click"));
            animateTree();
        }

        let treeProgress = 0;
        
        function animateTree() {
            ctx.clearRect(0, 0, width, height);
            drawFloatingHearts(); 

            const trunkX = width / 2;
            const trunkY = height;
            const trunkHeight = height * 0.40; 

            if (treeProgress < 1) {
                treeProgress += 0.008;
            } else {
                if (document.getElementById('content-layer').style.opacity == 0) {
                     document.getElementById('content-layer').style.opacity = 1;
                     createHeartCanopy(trunkX, trunkY - trunkHeight);
                     setInterval(updateTimer, 1000);
                     updateTimer(); 
                }
                drawHeartLeaves();
            }

            // Tronco
            ctx.beginPath();
            ctx.moveTo(trunkX, trunkY);
            ctx.lineTo(trunkX, trunkY - (trunkHeight * treeProgress));
            ctx.lineWidth = 18 * (1 - treeProgress * 0.4);
            ctx.strokeStyle = "#5d4037";
            ctx.lineCap = "round";
            ctx.stroke();

            // Ramas
            if (treeProgress > 0.6) {
                drawBranch(trunkX, trunkY - trunkHeight * 0.6, -1, treeProgress);
                drawBranch(trunkX, trunkY - trunkHeight * 0.75, 1, treeProgress);
            }

            requestAnimationFrame(animateTree);
        }

        function drawBranch(x, y, dir, progress) {
            const length = 60 * (progress - 0.5);
            if (length <= 0) return;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x + (30*dir), y - 30, x + (length*dir), y - length);
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#5d4037";
            ctx.stroke();
        }

        // --- HOJAS CORAZÓN (AUMENTADAS DE TAMAÑO) ---
        let leavesCreated = false;
        function createHeartCanopy(centerX, centerY) {
            if (leavesCreated) return;
            centerY += 20; 

            for (let i = 0; i < 350; i++) {
                let t = Math.random() * Math.PI * 2;
                let r = Math.sqrt(Math.random()) * 20; 
                
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                particles.push({
                    x: centerX + (x * r) * 11, 
                    y: centerY + (y * r) * 11,
                    // AQUÍ ESTÁ EL CAMBIO DE TAMAÑO (Antes 25+15 -> Ahora 35+20)
                    targetSize: Math.random() * 35 + 20, 
                    currentSize: 0,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    growSpeed: Math.random() * 0.5 + 0.1
                });
            }
            leavesCreated = true;
        }

        function drawHeartLeaves() {
            particles.forEach(p => {
                if (p.currentSize < p.targetSize) p.currentSize += p.growSpeed;
                drawHeartShape(p.x, p.y, p.currentSize, p.color);
            });
        }

        function drawHeartShape(x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x - size / 2, y - size / 2, x - size, y + size / 3, x, y + size);
            ctx.bezierCurveTo(x + size, y + size / 3, x + size / 2, y - size / 2, x, y);
            ctx.fill();
        }

        // --- FONDO ANIMADO ---
        function drawFloatingHearts() {
            if (Math.random() < 0.05) { 
                floatingHearts.push({
                    x: Math.random() * width,
                    y: height + 20,
                    size: Math.random() * 15 + 5,
                    speed: Math.random() * 2 + 1,
                    color: "rgba(255, 182, 193, 0.5)"
                });
            }
            for (let i = 0; i < floatingHearts.length; i++) {
                let h = floatingHearts[i];
                h.y -= h.speed;
                drawHeartShape(h.x, h.y, h.size, h.color);
                if (h.y < -20) { floatingHearts.splice(i, 1); i--; }
            }
        }

        // --- CONTADOR ---
        function updateTimer() {
            const now = new Date();
            
            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            
            let hours = now.getHours() - startDate.getHours();
            let minutes = now.getMinutes() - startDate.getMinutes();
            let seconds = now.getSeconds() - startDate.getSeconds();

            if (seconds < 0) { seconds += 60; minutes--; }
            if (minutes < 0) { minutes += 60; hours--; }
            if (hours < 0) { hours += 24; days--; }
            if (days < 0) {
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
                months--;
            }
            if (months < 0) { months += 12; years--; }

            const fmt = (n) => n < 10 ? '0' + n : n;

            document.getElementById('timer').innerHTML = 
                `${years} Años, ${months} Meses, ${days} Días<br>` +
                `<span style="font-size: 0.8em; opacity: 0.9">${fmt(hours)}h ${fmt(minutes)}m ${fmt(seconds)}s</span>`;
        }
    </script>
</body>
</html>
